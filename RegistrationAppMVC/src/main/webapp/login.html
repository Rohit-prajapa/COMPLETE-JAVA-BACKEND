<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Registration App</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;

            margin-bottom: 25px;

            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #667eea;
        }

        .btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background-color: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .btn:hover {
            background-color: #5568d9;
        }

        .register {
            text-align: center;

            margin-top: 20px;

            font-size: 14px;
        }

        .register a {
            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Login</h1>

        <form action="login" method="post">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required>

            </div>


            <button type="submit" class="btn">
                Login
            </button>

        </form>


        <div class="register">

            Don't have an account?

            <a href="index.html">
                Register
            </a>

        </div>

    </div>

</body>

</html>
