<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Second Web Application</title>
</head>

<body bgcolor="cyan">

    <center>

        <h1>Welcome to our Second WebApp</h1>
        <h2>Kindly Register to proceed further!</h2>

        <form action="register" method="post">

            <table>

                <tr>
                    <td>User Name</td>
                    <td>
                        <input type="text" name="uname">
                    </td>
                </tr>

                <tr>
                    <td>User City</td>
                    <td>
                        <input type="text" name="ucity">
                    </td>
                </tr>

                <tr>
                    <td>Email</td>
                    <td>
                        <input type="email" name="uemail">
                    </td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td>
                        <input type="password" name="upassword">
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="SignUp">
                    </td>
                </tr>

            </table>

        </form>

    </center>

</body>
</html>
